<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Roll Call Sushi." />
    <title>Sign in | Roll Call Sushi</title>
    <style>
      :root { --ink:#183b35; --deep:#0c2925; --rice:#fffaf0; --paper:#f6eedf; --coral:#f06c5b; --muted:#6e7d76; }
      * { box-sizing:border-box; } body { min-width:320px; min-height:100vh; margin:0; color:var(--ink); background:var(--paper); font-family:Arial,Helvetica,sans-serif; }
      .page { position:relative; display:grid; min-height:100vh; place-items:center; overflow:hidden; padding:32px 20px; background:radial-gradient(circle at 8% 10%,#fff9ec 0 16%,transparent 16.2%),radial-gradient(circle at 94% 91%,#ead6b6 0 18%,transparent 18.2%); }
      .page::before,.page::after { position:absolute; z-index:0; color:rgba(24,59,53,.055); font-family:Georgia,serif; font-size:clamp(11rem,29vw,23rem); line-height:.7; } .page::before { content:"寿"; top:8%; left:-4%; } .page::after { content:"司"; right:-4%; bottom:7%; }
      .card { position:relative; z-index:1; width:min(100%,430px); padding:clamp(30px,6vw,48px); background:var(--rice); box-shadow:0 25px 60px rgba(58,48,32,.18); }
      .brand { display:inline-flex; align-items:center; gap:10px; color:var(--deep); font-size:.92rem; font-weight:800; letter-spacing:.09em; text-decoration:none; text-transform:uppercase; } .brand-mark { display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--coral); color:#fff; font:700 1.25rem Georgia,serif; transform:rotate(-12deg); }
      .eyebrow { margin:43px 0 11px; color:#c65b4d; font-size:.73rem; font-weight:800; letter-spacing:.15em; text-transform:uppercase; } h1 { margin:0; color:var(--deep); font:2.55rem/.95 Georgia,serif; letter-spacing:-.055em; } .intro { margin:14px 0 28px; color:var(--muted); font-size:.93rem; line-height:1.5; }
      .field { display:block; margin-top:17px; color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; } input { width:100%; margin-top:8px; padding:13px 12px; border:1px solid #d8cfc0; border-radius:0; background:#fff; color:var(--deep); font:1rem Arial,sans-serif; } input:focus { border-color:var(--coral); outline:2px solid rgba(240,108,91,.18); outline-offset:1px; }
      .submit { width:100%; margin-top:27px; padding:14px; border:1px solid var(--coral); background:var(--coral); color:#fff; font:800 .88rem Arial,sans-serif; cursor:pointer; } .submit:hover,.submit:focus-visible { background:#dd594a; outline:none; }
      .message { min-height:1.4em; margin:17px 0 0; color:var(--muted); font-size:.84rem; line-height:1.45; } .message.error { color:#b23a2e; } .switch { margin:24px 0 0; padding-top:20px; border-top:1px solid #e8dfd1; color:var(--muted); font-size:.84rem; text-align:center; } .link-button { padding:0; border:0; background:none; color:var(--ink); font:inherit; font-weight:800; text-decoration:underline; cursor:pointer; }
      .account { display:none; } .account.visible { display:block; } .account h1 { margin-top:40px; } .account p { color:var(--muted); line-height:1.55; } .signout { width:100%; margin-top:13px; padding:13px; border:1px solid var(--ink); background:transparent; color:var(--ink); font:800 .85rem Arial,sans-serif; cursor:pointer; }
      .privacy { margin:23px 0 0; color:#7a847e; font-size:.75rem; line-height:1.45; text-align:center; }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="title">
        <a class="brand" href="index.html" aria-label="Roll Call home"><span class="brand-mark" aria-hidden="true">•</span> Roll Call</a>
        <div id="auth-view">
          <p class="eyebrow" id="eyebrow">Welcome back</p>
          <h1 id="title">Sign in for<br>the good stuff.</h1>
          <p class="intro" id="intro">Save your favorite rolls and keep your next visit close at hand.</p>
          <form id="auth-form" novalidate>
            <label class="field" for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required /></label>
            <label class="field" for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
            <button class="submit" id="submit" type="submit">Sign in</button>
            <p class="message" id="message" role="status" aria-live="polite"></p>
          </form>
          <p class="switch"><span id="switch-copy">New to Roll Call?</span> <button class="link-button" id="switch-mode" type="button">Create an account</button></p>
          <p class="privacy">This demo stores your account only in this browser.</p>
        </div>
        <div class="account" id="account-view" aria-live="polite">
          <p class="eyebrow">You’re on the list</p>
          <h1 id="account-title">Welcome back.</h1>
          <p id="account-copy"></p>
          <button class="signout" id="signout" type="button">Sign out</button>
        </div>
      </section>
    </main>
    <script>
      const storageKey = 'roll-call-accounts';
      const sessionKey = 'roll-call-session';
      const form = document.querySelector('#auth-form');
      const email = document.querySelector('#email');
      const password = document.querySelector('#password');
      const message = document.querySelector('#message');
      const switchMode = document.querySelector('#switch-mode');
      let creating = false;

      function accounts() { try { return JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { return {}; } }
      async function digest(value) {
        const bytes = new TextEncoder().encode(value);
        const hash = await crypto.subtle.digest('SHA-256', bytes);
        return Array.from(new Uint8Array(hash), byte => byte.toString(16).padStart(2, '0')).join('');
      }
      function showMessage(text, error = false) { message.textContent = text; message.classList.toggle('error', error); }
      function setMode(register) {
        creating = register; form.reset(); showMessage('');
        document.querySelector('#eyebrow').textContent = register ? 'Join the roll' : 'Welcome back';
        document.querySelector('#title').innerHTML = register ? 'Make room for<br>more sushi.' : 'Sign in for<br>the good stuff.';
        document.querySelector('#intro').textContent = register ? 'Create an account to keep your favorite rolls close at hand.' : 'Save your favorite rolls and keep your next visit close at hand.';
        document.querySelector('#submit').textContent = register ? 'Create account' : 'Sign in';
        document.querySelector('#switch-copy').textContent = register ? 'Already have an account?' : 'New to Roll Call?';
        switchMode.textContent = register ? 'Sign in' : 'Create an account';
        password.autocomplete = register ? 'new-password' : 'current-password';
      }
      function showAccount(address) {
        document.querySelector('#auth-view').hidden = true;
        document.querySelector('#account-view').classList.add('visible');
        document.querySelector('#account-title').textContent = `Welcome, ${address.split('@')[0]}.`;
        document.querySelector('#account-copy').textContent = 'You’re signed in and ready for your next perfect roll.';
      }
      form.addEventListener('submit', async event => {
        event.preventDefault();
        const address = email.value.trim().toLowerCase();
        const secret = password.value;
        if (!email.validity.valid) return showMessage('Enter a valid email address.', true);
        if (secret.length < 8) return showMessage('Your password must be at least 8 characters.', true);
        const saved = accounts(); const passwordHash = await digest(secret);
        if (creating) {
          if (saved[address]) return showMessage('An account already exists for this email. Try signing in.', true);
          saved[address] = passwordHash; localStorage.setItem(storageKey, JSON.stringify(saved));
        } else if (saved[address] !== passwordHash) return showMessage('That email or password does not match an account.', true);
        localStorage.setItem(sessionKey, address); showAccount(address);
      });
      switchMode.addEventListener('click', () => setMode(!creating));
      document.querySelector('#signout').addEventListener('click', () => { localStorage.removeItem(sessionKey); document.querySelector('#account-view').classList.remove('visible'); document.querySelector('#auth-view').hidden = false; setMode(false); email.focus(); });
      const activeSession = localStorage.getItem(sessionKey); if (activeSession) showAccount(activeSession);
    </script>
  </body>
</html>
