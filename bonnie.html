<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bonnie's Sushi Queue</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f2e8; color: #18222f; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(90vw, 640px); padding: 48px; border-radius: 22px; background: white; box-shadow: 0 18px 60px #17263820; }
    h1 { margin: 0; color: #2474d3; font: 700 clamp(3rem, 12vw, 6rem)/.95 Georgia, serif; letter-spacing: -.06em; }
    p { color: #56606b; }
    ol { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; padding: 0; list-style: none; }
    li { padding: 14px; border-radius: 10px; background: #18222f; color: white; }
    small { display: block; margin-bottom: 4px; color: #aab6c4; text-transform: uppercase; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <h1>Bonnie</h1>
    <p>Table queue — guests waiting to join the sushi service.</p>
    <ol aria-label="Table queue">
      <li><small>01</small>Marcus</li>
      <li><small>02</small>Andre</li>
      <li><small>03</small>Jordan</li>
      <li><small>04</small>Devon</li>
    </ol>
  </main>
</body>
</html>
